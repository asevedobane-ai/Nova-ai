<script>
function openWorkspace() {
  const landing = document.getElementById("landing");
  const workspace = document.getElementById("workspace");

  if (landing) {
    landing.style.display = "none";
  }

  if (workspace) {
    workspace.style.display = "flex";
    workspace.classList.add("active");
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


function closeWorkspace() {
  const landing = document.getElementById("landing");
  const workspace = document.getElementById("workspace");

  if (workspace) {
    workspace.style.display = "none";
    workspace.classList.remove("active");
  }

  if (landing) {
    landing.style.display = "block";
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


function toggleSidebar() {
  const sidebar = document.querySelector(".workspace-sidebar");

  if (sidebar) {
    sidebar.classList.toggle("open");
  }
}


function scrollToSection(id) {
  const section = document.getElementById(id);

  if (section) {
    section.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }
}


function useSuggestion(text) {
  const input = document.getElementById("messageInput");

  if (!input) return;

  input.value = text;
  input.focus();

  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
}


function newChat() {
  const messages = document.getElementById("messages");
  const welcome = document.getElementById("welcome");
  const input = document.getElementById("messageInput");

  if (messages) {
    messages.innerHTML = "";
  }

  if (welcome) {
    welcome.style.display = "block";
  }

  if (input) {
    input.value = "";
    input.style.height = "auto";
    input.focus();
  }
}


function filterHistory() {
  const searchInput = document.getElementById("historySearch");
  const historyItems = document.querySelectorAll(".history-item");

  if (!searchInput) return;

  const query = searchInput.value.toLowerCase().trim();

  historyItems.forEach(item => {
    const text = item.textContent.toLowerCase();

    if (text.includes(query)) {
      item.style.display = "";
    } else {
      item.style.display = "none";
    }
  });
}


function escapeHTML(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}


function addMessage(text, type) {
  const messages = document.getElementById("messages");

  if (!messages) return;

  const message = document.createElement("div");

  message.className = `message ${type}`;

  message.innerHTML = `
    <div class="message-content">
      ${escapeHTML(text)}
    </div>
  `;

  messages.appendChild(message);

  messages.scrollTop = messages.scrollHeight;
}


async function sendMessage() {
  const input = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const welcome = document.getElementById("welcome");

  if (!input) return;

  const message = input.value.trim();

  if (!message) return;

  if (welcome) {
    welcome.style.display = "none";
  }

  addMessage(message, "user");

  input.value = "";
  input.style.height = "auto";

  if (sendButton) {
    sendButton.disabled = true;
  }

  try {
    const response = await fetch("/Api/chat", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "NOVA couldn't process that request.");
    }

    if (data.reply) {
      addMessage(data.reply, "assistant");
    } else {
      addMessage(
        "NOVA didn't receive a response. Please try again.",
        "assistant"
      );
    }

  } catch (error) {
    console.error("NOVA error:", error);

    addMessage(
      "Something went wrong connecting to NOVA. Please try again.",
      "assistant"
    );

  } finally {
    if (sendButton) {
      sendButton.disabled = false;
    }

    input.focus();
  }
}


document.addEventListener("DOMContentLoaded", () => {

  /*
    Make every button using openWorkspace()
    work even if the inline onclick doesn't fire.
  */

  document
    .querySelectorAll('[onclick="openWorkspace()"]')
    .forEach(button => {

      button.addEventListener("click", openWorkspace);

    });


  const input = document.getElementById("messageInput");

  if (input) {

    input.addEventListener("keydown", event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    });


    input.addEventListener("input", () => {

      input.style.height = "auto";

      input.style.height =
        input.scrollHeight + "px";

    });

  }


  const searchInput =
    document.getElementById("historySearch");

  if (searchInput) {

    searchInput.addEventListener(
      "input",
      filterHistory
    );

  }

});
</script>
